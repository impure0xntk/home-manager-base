[filters.nix]
description = "Compact nix output — drop eval/build progress, keep results and errors"
match_command = "^(sudo\\s+)?nix\\b"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^\\s*$",
  "^evaluating '",
  "^fetching path input '",
  "^copying path ",
  "^copied \\d+ paths",
  "^copying \\d+ paths",
  "^these \\d+ derivations will be built:",
  "^these \\d+ paths will be fetched",
  "^\\s+/nix/store/\\S+$",
  "^building '/nix/store/",
  "^built '/nix/store/",
  "^unpacking '?/nix/store",
  "^\\s*\\[\\d+/\\d+ (built|copied)",
  "^\\s*downloading '",
  "^\\s*fetching .* from ",
  "^querying info about ",
  "^warning: Git tree '.*' is dirty",
  "^warning: creating lock file",
  "^warning: updating lock file",
]
truncate_lines_at = 150
# `nix eval` / `nix search` print the value or the error after the progress log,
# so a head-only cap (max_lines) would drop exactly what the agent asked for.
head_lines = 40
tail_lines = 20
on_empty = "nix: ok"

[[tests.nix]]
name = "strips store paths and dirty warning, keeps result"
input = """
warning: Git tree '/Users/x/.config/nix-modules' is dirty
these 2 derivations will be built:
  /nix/store/aaa-foo.drv
  /nix/store/bbb-bar.drv
copying path '/nix/store/ccc-baz' from 'https://cache.nixos.org'
building '/nix/store/aaa-foo.drv'
done
"""
expected = "done"

[[tests.nix]]
name = "all-noise short-circuits to ok"
input = """
warning: Git tree '/Users/x/repo' is dirty
copying path '/nix/store/ccc-baz' from 'https://cache.nixos.org'
"""
expected = "nix: ok"

[[tests.nix]]
name = "strips eval progress, keeps the evaluated value"
input = """
fetching path input 'path:/nix/store/aaa-source'
evaluating 'legacyPackages.x86_64-linux'...
evaluating 'legacyPackages.x86_64-linux.codegraph'...
2
"""
expected = "2"

[[tests.nix]]
name = "strips a long eval log but keeps the trailing error"
input = """
evaluating 'legacyPackages.x86_64-linux.a'...
evaluating 'legacyPackages.x86_64-linux.b'...
evaluating 'legacyPackages.x86_64-linux.c'...
error: no results for the given search term(s)!
"""
expected = "error: no results for the given search term(s)!"

[filters.home-manager]
description = "Compact home-manager activation — drop Activating/copy/build noise, keep result and errors"
match_command = "^(sudo\\s+)?home-manager\\b"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^\\s*$",
  "^Starting home-manager activation",
  "^Activating ",
  "^Creating profile generation ",
  "^No change so reusing latest profile generation",
  "^copying path ",
  "^copied \\d+ paths",
  "^these \\d+ derivations will be built:",
  "^\\s+/nix/store/\\S+$",
  "^building '/nix/store/",
  "^\\s*\\[\\d+/\\d+ (built|copied)",
  "^warning: Git tree '.*' is dirty",
]
truncate_lines_at = 150
head_lines = 30
tail_lines = 20
on_empty = "home-manager: ok"

[[tests.home-manager]]
name = "strips activation steps, keeps warnings/output"
input = """
Starting home-manager activation
Activating checkLinkTargets
Activating installPackages
copying path '/nix/store/zzz-pkg' from 'https://cache.nixos.org'
Activating linkGeneration
"""
expected = "home-manager: ok"

# Every field below is mandatory: rtk deserializes config.toml with serde and
# rejects unknown/missing keys, which silently disables the sqlite recall store.
# Without it a lossy filter falls back to printing the full raw output.
[display]
colors = false
emoji = false
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = ["*.lock", "*.min.js", "*.min.css"]

[telemetry]
enabled = false

[tracking]
enabled = false
history_days = 90
